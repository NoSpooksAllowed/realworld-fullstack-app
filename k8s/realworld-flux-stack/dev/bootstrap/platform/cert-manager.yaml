apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: database
  path: ./k8s/realworld-flux-stack/dev/platform/cert-manager
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
